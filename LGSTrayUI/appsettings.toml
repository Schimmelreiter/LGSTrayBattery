[UI]
enableRichToolTips = true

[HTTPServer]
enabled = true
addr = "localhost"
port = 12321
useIpv6 = true

[MQTT]
# Publish battery state to an MQTT broker, with Home Assistant discovery
enabled = false
host = "homeassistant.local"
port = 1883
useTls = false
username = ""
password = ""
# Name of this PC in Home Assistant (empty = computer name)
name = ""
topicPrefix = "lgstray"
discoveryPrefix = "homeassistant"

[GHub]
enabled = true

[Native]
enabled = true

# Time in seconds to retry a device poll on failure
retryTime = 10

# Time in seconds to next device poll on sucess
pollPeriod = 600

# List of disabled devices
disabledDevices = [
]