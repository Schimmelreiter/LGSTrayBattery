name: Release

# Every push to the branch "schimmelreiter" builds the program. If the version in LGSTrayUI.csproj
# has no release yet, a release v<version>-schimmelreiter (with tag) is created.
on:
  push:
    branches: ['schimmelreiter']
    paths-ignore: ['readme.md', 'RELEASE_NOTES.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Publish
      run: python .\publish.py --version-suffix="-schimmelreiter"

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: LGSTray
        path: bin/Release/Publish/*.zip

    - name: Create release (once per version)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $version = ([xml](Get-Content LGSTrayUI/LGSTrayUI.csproj)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
        $tag = "v$version-schimmelreiter"
        gh release view $tag -R "${{ github.repository }}" 2>$null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release $tag already exists - build only"
          exit 0
        }
        gh release create $tag (get-item ./bin/Release/Publish/*.zip) `
          -R "${{ github.repository }}" --target "${{ github.sha }}" --title $tag --notes-file RELEASE_NOTES.md
