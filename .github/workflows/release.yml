name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Publish
      run: python .\publish.py --version-suffix="-schimmelreiter"

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: LGSTray
        path: bin/Release/Publish/*.zip

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" (get-item ./bin/Release/Publish/*.zip) `
          -R "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
